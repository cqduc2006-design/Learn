<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>W4 & W5 redo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section id="w4 lab 2">
      <form id="ScoresForm">
        <input type="text" id="studentName" placeholder="Student Name" />
        <input type="number" id="scores" placeholder="Score" />
        <button type="submit" id="submit">Submit</button>
        <div id="message-container"></div>
      </form>
    </section>

    <br />

    <section id="W5 table">
      <table id="user-table" border="1">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Email</th>
            <th>Phone</th>
          </tr>
        </thead>

        <tbody></tbody>
      </table>

      <button onclick="loadUsers()">Users load</button>
    </section>

    <script src="app_redo_W4_W5.js" defer></script>
  </body>
</html>
